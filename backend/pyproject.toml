[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medlens"
version = "0.1.0"
description = "MedLens - ECG and chest X-ray reader (decision support / teaching tool)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydicom>=2.4",
  "numpy>=1.26",
  "pillow>=10.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
ecg = ["neurokit2", "wfdb", "opencv-python-headless"]
rx = ["torch", "torchvision", "torchxrayvision"]
recon = ["trimesh"]
ai = ["anthropic", "matplotlib"]
all = ["medlens[ecg,rx,recon,ai,dicom-compressed]"]
dicom-compressed = ["pylibjpeg", "pylibjpeg-libjpeg", "pylibjpeg-openjpeg"]
heic = ["pillow-heif"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*", "medlens_data*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
