name: Histórico e publicação
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [claude/vote-count-regional-app-irtq1b]
    paths: ['public/**', 'scripts/**', '.github/workflows/historico.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: historico
  cancel-in-progress: false
jobs:
  publica:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/vote-count-regional-app-irtq1b, path: src }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copia o site (preserva historico.json)
        run: rsync -a --exclude historico.json src/public/ site/
      - name: Retrato do TSE a cada minuto (~14 min por execução)
        working-directory: site
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 14); do
            node ../src/scripts/snapshot.js historico.json || true
            git add -A
            git diff --cached --quiet || { git commit -qm "Atualiza site e histórico"; git pull -q --rebase && git push -q || true; }
            [ "$i" -lt 14 ] && sleep 60
          done
