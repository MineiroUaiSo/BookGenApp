  nome_pt: Padrão de Brugada tipo 1
  criterio: ST em abóbada (coved) >=2 mm no ponto J em ≥1 derivação V1-V2 seguido por T negativa.
  limiares:
    j_mm: '>=2'
  medidas: []
  gatilhos: []
  armadilhas:
