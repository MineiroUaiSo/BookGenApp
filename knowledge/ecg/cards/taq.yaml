    tipo: paráfrase
  revisado_por_medico: false
  verificar: conferir
- id: taq.qrs_largo
  versao: 1
  nome_pt: Taquicardia de QRS largo
  criterio: 'Presumir TV até prova contrária; favorecem TV: dissociação AV, captura, fusão, concordância
    precordial, eixo extremo.'
  limiares: {}
  medidas: []
  gatilhos: []
  armadilhas:
  - Aberrância de condução e pré-excitação também.
  - Brugada 1991 e Vereckei servem de auxílio.
  nao_confundir:
  - conducao.aberrancia
  - taq.tv
  fonte:
    ref: brugada_1991
    local: Circulation 1991;83:1649
    tipo: paráfrase
  revisado_por_medico: false
- id: taq.tv
  versao: 1
  nome_pt: Taquicardia ventricular
  criterio: Três ou mais batimentos ventriculares consecutivos >100 bpm; sustentada >30 s.
  limiares: {}
  medidas: []
  gatilhos: []
  armadilhas:
