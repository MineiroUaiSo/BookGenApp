cartoes:
- id: taq.tsv
  versao: 1
  nome_pt: Taquicardia supraventricular de QRS estreito
  criterio: 'Taquicardia regular de QRS <120 ms, FC 140-250, P ausente/retrógrada: AVNRT, AVRT ou atrial.'
  limiares: {}
  medidas: []
  gatilhos: []
  armadilhas:
  - Flutter 2:1 e taquicardia sinusal fazem parte do diferencial.
  nao_confundir:
